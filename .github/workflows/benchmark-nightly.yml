name: warp-s3-benchmarks

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Push the generated benchmark report to gh-pages"
        required: false
        default: false
        type: boolean
      providers:
        description: "Providers to run, space separated. Empty runs all."
        required: false
        default: ""
        type: string
      profile_suite:
        description: "Benchmark profile suite to run."
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - extended
      warp_autoterm:
        description: "Enable Warp --autoterm for measured profiles."
        required: false
        default: true
        type: boolean
      collect_diagnostics:
        description: "Collect provider container diagnostics during measured profiles."
        required: false
        default: false
        type: boolean
      ozone_deployment_mode:
        description: "Ozone deployment mode."
        required: false
        default: local
        type: choice
        options:
          - compose
          - local
      ozone_local_image:
        description: "Container image for ozone_deployment_mode=local."
        required: false
        default: apache/ozone-runner:20260206-2-jdk21
        type: string
      ozone_local_ref:
        description: "Ozone branch/ref to build for ozone_deployment_mode=local."
        required: false
        default: codex/local-ozone-series
        type: string
      ozone_local_datanodes:
        description: "Number of in-process datanodes for ozone_deployment_mode=local."
        required: false
        default: "1"
        type: string
      ozone_local_pipeline_owner_container_count:
        description: "SCM per-pipeline owner container count for ozone_deployment_mode=local."
        required: false
        default: "1"
        type: string
      ozone_local_container_size:
        description: "SCM container size for ozone_deployment_mode=local."
        required: false
        default: 80MB
        type: string
      ozone_local_block_size:
        description: "SCM block size for ozone_deployment_mode=local."
        required: false
        default: 64MB
        type: string

permissions:
  contents: write

concurrency:
  group: warp-s3-benchmarks-pages
  cancel-in-progress: false

env:
  PUBLISH_PAGES: ${{ github.event_name == 'schedule' || github.event.inputs.publish_pages == true || github.event.inputs.publish_pages == 'true' || inputs.publish_pages == true || inputs.publish_pages == 'true' || false }}
  PROFILE_SUITE: ${{ (github.event_name == 'schedule' || github.event.inputs.publish_pages == true || github.event.inputs.publish_pages == 'true' || inputs.publish_pages == true || inputs.publish_pages == 'true') && 'extended' || github.event.inputs.profile_suite || 'smoke' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider: [rustfs, seaweedfs, ceph, ozone]
    steps:
      - name: Check provider filter
        id: filter
        shell: bash
        env:
          REQUESTED_PROVIDERS: ${{ github.event.inputs.providers || '' }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          if [ -z "${REQUESTED_PROVIDERS}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          elif printf ' %s ' "${REQUESTED_PROVIDERS}" | grep -q " ${PROVIDER} "; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free runner disk space
        if: ${{ steps.filter.outputs.enabled == 'true' && env.ACT != 'true' }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        if: ${{ steps.filter.outputs.enabled == 'true' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Update Warp submodule to latest upstream
        if: ${{ steps.filter.outputs.enabled == 'true' }}
        run: git submodule update --init --recursive --remote warp

      - name: Set up Go
        if: ${{ steps.filter.outputs.enabled == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Set up Python
        if: ${{ steps.filter.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        if: ${{ steps.filter.outputs.enabled == 'true' }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Java for Ozone local
        if: ${{ steps.filter.outputs.enabled == 'true' && matrix.provider == 'ozone' && (github.event.inputs.ozone_deployment_mode || 'local') == 'local' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        if: ${{ steps.filter.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          uv sync --locked
          sudo apt-get update
          sudo apt-get install -y jq
          docker compose version || docker-compose --version
          df -h

      - name: Build Warp
        if: ${{ steps.filter.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          go -C warp build -o warp .
          go clean -cache -modcache || true
          docker system prune -af --volumes || true
          df -h

      - name: Build experimental Ozone local
        if: ${{ steps.filter.outputs.enabled == 'true' && matrix.provider == 'ozone' && (github.event.inputs.ozone_deployment_mode || 'local') == 'local' }}
        env:
          OZONE_LOCAL_REPO: https://github.com/peterxcli/ozone.git
          OZONE_LOCAL_REF: ${{ github.event.inputs.ozone_local_ref || 'codex/local-ozone-series' }}
        run: |
          set -euo pipefail
          ozone_src="${RUNNER_TEMP}/ozone-local-src"
          rm -rf "${ozone_src}"
          git clone --depth 1 --branch "${OZONE_LOCAL_REF}" "${OZONE_LOCAL_REPO}" "${ozone_src}"
          mvn -B \
            -DskipTests \
            -DskipRecon \
            -DskipShade \
            -Dskip.npm \
            -Dmaven.javadoc.skip=true \
            -Pdist \
            -pl :ozone-dist \
            -am \
            package \
            -f "${ozone_src}/pom.xml"
          ozone_home="$(find "${ozone_src}/hadoop-ozone/dist/target" -maxdepth 1 -type d -name 'ozone-*' | head -n 1)"
          test -n "${ozone_home}"
          test -x "${ozone_home}/bin/ozone"
          echo "OZONE_DEPLOYMENT_MODE=local" >> "${GITHUB_ENV}"
          echo "OZONE_LOCAL_DIST_DIR=${ozone_home}" >> "${GITHUB_ENV}"
          echo "OZONE_LOCAL_IMAGE=${{ github.event.inputs.ozone_local_image || 'apache/ozone-runner:20260206-2-jdk21' }}" >> "${GITHUB_ENV}"
          df -h

      - name: Run provider benchmark
        if: ${{ steps.filter.outputs.enabled == 'true' }}
        env:
          PROVIDER: ${{ matrix.provider }}
          OUTPUT_ROOT: ${{ github.workspace }}/out/providers/${{ matrix.provider }}
          KEEP_BENCHDATA: "false"
          OZONE_DEPLOYMENT_MODE: ${{ matrix.provider == 'ozone' && (github.event.inputs.ozone_deployment_mode || 'local') || 'compose' }}
          OZONE_LOCAL_IMAGE: ${{ github.event.inputs.ozone_local_image || 'apache/ozone-runner:20260206-2-jdk21' }}
          OZONE_LOCAL_DATANODES: ${{ github.event.inputs.ozone_local_datanodes || '1' }}
          OZONE_LOCAL_PIPELINE_OWNER_CONTAINER_COUNT: ${{ github.event.inputs.ozone_local_pipeline_owner_container_count || '1' }}
          OZONE_LOCAL_CONTAINER_SIZE: ${{ github.event.inputs.ozone_local_container_size || '80MB' }}
          OZONE_LOCAL_BLOCK_SIZE: ${{ github.event.inputs.ozone_local_block_size || '64MB' }}
          WARP_AUTOTERM: ${{ github.event.inputs.warp_autoterm || 'true' }}
          BENCHMARK_DIAGNOSTICS: ${{ github.event.inputs.collect_diagnostics || 'false' }}
        run: |
          set -euo pipefail
          export PROFILE_FILE="${GITHUB_WORKSPACE}/benchmark/profiles/${PROFILE_SUITE}.json"
          echo "Using profile suite: ${PROFILE_SUITE} (${PROFILE_FILE})"
          echo "Warp autoterm: ${WARP_AUTOTERM}"
          echo "Provider diagnostics: ${BENCHMARK_DIAGNOSTICS}"
          bash scripts/run-benchmark-provider.sh "${PROVIDER}"

      - name: Upload provider artifact
        if: ${{ always() && steps.filter.outputs.enabled == 'true' && env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: warp-provider-${{ matrix.provider }}
          path: out/providers/${{ matrix.provider }}
          if-no-files-found: warn

  aggregate-pages:
    runs-on: ubuntu-latest
    needs: benchmark
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Update Warp submodule to latest upstream
        run: git submodule update --init --recursive --remote warp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Download provider artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: warp-provider-*
          path: out/provider-artifacts
          merge-multiple: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          uv sync --locked
          npm --prefix site ci
          go -C warp build -o warp .
          go clean -cache -modcache || true
          df -h

      - name: Normalize benchmark run
        env:
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          provider_args=()
          while IFS= read -r metadata; do
            provider_args+=(--provider-dir "$(dirname "${metadata}")")
          done < <(find out/provider-artifacts -name metadata.json -print | sort)
          if [ "${#provider_args[@]}" -eq 0 ]; then
            echo "No provider artifacts found" >&2
            exit 1
          fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          runner_json="$(source scripts/benchmark/common.sh; write_runner_json)"
          uv run python scripts/normalize_benchmark.py \
            "${provider_args[@]}" \
            --out out/run/run.json \
            --run-id "${finished_at//:/-}" \
            --started-at "${finished_at}" \
            --finished-at "${finished_at}" \
            --workflow-run-url "${WORKFLOW_RUN_URL}" \
            --warp-repo "https://github.com/minio/warp" \
            --warp-commit "$(git -C warp rev-parse HEAD)" \
            --warp-version "$(./warp/warp --version 2>/dev/null || true)" \
            --runner-json "${runner_json}"

      - name: Build benchmark site
        run: |
          set -euo pipefail
          npm --prefix site run build
          uv run python scripts/build_pages.py \
            --output-dir out/pages \
            --new-run out/run/run.json \
            --data-format parquet

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-benchmark-report
          path: |
            out/run
            out/pages
          if-no-files-found: error

      - name: Publish gh-pages
        if: ${{ env.PUBLISH_PAGES == 'true' && hashFiles('out/pages/index.html') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pages_repo="${RUNNER_TEMP}/pages-repo"
          rm -rf "${pages_repo}"
          git init "${pages_repo}"
          git -C "${pages_repo}" checkout -b gh-pages
          git -C "${pages_repo}" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rsync -a --delete --exclude .git out/pages/ "${pages_repo}/"
          touch "${pages_repo}/.nojekyll"
          git -C "${pages_repo}" config user.name "github-actions[bot]"
          git -C "${pages_repo}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${pages_repo}" add .
          git -C "${pages_repo}" commit -m "Publish Warp benchmark report"
          git -C "${pages_repo}" push --force origin gh-pages
